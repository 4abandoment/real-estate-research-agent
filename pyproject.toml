[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-research-agent"
version = "0.1.0"
description = "Slack research agent for real-estate finance: scoping, multi-source retrieval, SQL transparency, PII protection and human-in-the-loop escalation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "slack_bolt>=1.21",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "psycopg[binary]>=3.2",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "fastembed>=0.3",
    "flask>=3.0",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/research_agent/monitor.py" = ["E501"]  # embedded HTML/CSS/JS template lines

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
